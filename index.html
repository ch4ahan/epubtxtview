<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>책갈피 — 소설 뷰어</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-theme="light">
  <!-- ───────────────── 서재 (Library) ───────────────── -->
  <section id="screen-library" class="screen active">
    <header class="top-bar">
      <h1 class="brand">책갈피</h1>
      <div class="top-actions">
        <button id="btn-view-toggle" class="icon-btn" title="보기 전환" aria-label="보기 전환">▦</button>
        <button id="btn-sort" class="icon-btn" title="정렬" aria-label="정렬">↕</button>
        <button id="btn-backup" class="icon-btn" title="백업/복원" aria-label="백업">⤓</button>
        <button id="btn-add-book" class="primary-btn">＋ 책 추가</button>
      </div>
    </header>
    <div id="library-grid" class="library grid-view"></div>
    <div id="library-empty" class="empty-state hidden">
      <p class="empty-emoji">📖</p>
      <p>아직 책이 없어요.</p>
      <p class="muted">위의 <b>＋ 책 추가</b>로 TXT 소설을 불러오세요.</p>
    </div>
  </section>

  <!-- ───────────────── 뷰어 (Reader) ───────────────── -->
  <section id="screen-reader" class="screen">
    <div id="reader-page" class="reader-page"></div>

    <!-- 자유 터치 영역 (좌표 기반, 투명) -->
    <div id="touch-layer" class="touch-layer"></div>

    <!-- 상단 메뉴 바 (탭하면 토글) -->
    <div id="reader-menu" class="reader-menu hidden">
      <div class="reader-menu-top">
        <button id="btn-reader-back" class="icon-btn">‹ 서재</button>
        <span id="reader-title" class="reader-title"></span>
        <div>
          <button id="btn-toc" class="icon-btn" title="목차">≡</button>
          <button id="btn-search" class="icon-btn" title="검색">🔍</button>
          <button id="btn-bookmark" class="icon-btn" title="북마크">🔖</button>
          <button id="btn-highlight-mode" class="icon-btn" title="형광펜">🖊</button>
          <button id="btn-reader-settings" class="icon-btn" title="읽기 설정">⚙</button>
        </div>
      </div>
      <div class="reader-menu-bottom">
        <input type="range" id="page-slider" min="0" max="100" value="0" />
        <div class="page-indicator"><span id="page-now">0</span> / <span id="page-total">0</span></div>
      </div>
    </div>
  </section>

  <!-- ───────────────── 발췌 모아보기 / 추출 ───────────────── -->
  <section id="screen-excerpts" class="screen">
    <header class="top-bar">
      <button id="btn-excerpts-back" class="icon-btn">‹ 뒤로</button>
      <h1 class="brand" id="excerpts-title">형광펜 · 메모</h1>
      <span></span>
    </header>
    <div class="excerpt-tabs">
      <button class="tab active" data-tab="linked">형광펜</button>
      <button class="tab" data-tab="bookmarks">북마크</button>
      <button class="tab" data-tab="unlinked">미연결 보관함</button>
    </div>
    <div id="excerpt-list" class="excerpt-list"></div>
  </section>

  <!-- ───────────────── 모달 컨테이너 ───────────────── -->
  <div id="modal-root"></div>
  <div id="toast" class="toast hidden"></div>

  <!-- 파일 입력 (숨김) -->
  <input type="file" id="file-input-txt" accept=".txt,text/plain" hidden />
  <input type="file" id="file-input-cover" accept="image/*" hidden />
  <input type="file" id="file-input-json" accept=".json,application/json" hidden />

  <script src="js/zip.js"></script>
  <script src="js/db.js"></script>
  <script src="js/encoding.js"></script>
  <script src="js/chapters.js"></script>
  <script src="js/highlights.js"></script>
  <script src="js/viewer.js"></script>
  <script src="js/cards.js"></script>
  <script src="js/epub.js"></script>
  <script src="js/backup.js"></script>
  <script src="js/excerpts.js"></script>
  <script src="js/library.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
